name: deploy-pages

# 推送 main 时自动构建并部署到 Cloudflare Pages (项目 mathx-bridge)。
# 依赖仓库 secrets：
#   CLOUDFLARE_API_TOKEN   — Cloudflare API Token（Pages:Edit + Account/Zone 权限）
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账户 ID
# 运行时环境变量（DATABASE_URL / ADMIN_TOKEN / TURNSTILE_SECRET /
# CLAIMS_WRITE_ENABLED）在 Pages 项目 Settings -> Environment variables 配置，
# 不在构建期注入。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Actions 不允许在 step 的 if 里读 secrets context，
    # 所以先注入 job 级 env，再用 env 判断是否配置了部署凭证。
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24：本地运行依赖 type-stripping 直接 import contracts/*.ts
          # （参考核验器与守卫共用同一实现），且满足 wrangler 4.x 的最低要求。
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guardrails (contract verifier + catalog + laws + impact + needs + audits + tools + ledger unit tests)
        run: |
          node scripts/check-problems.mjs
          node scripts/check-laws.mjs
          node scripts/check-impact.mjs
          node scripts/check-needs.mjs
          node scripts/check-audits.mjs
          node scripts/check-tools.mjs
          node --test scripts/catalog-checks.test.mjs
      - name: Lean anchor guard (compile lean/*.lean + inline sync)
        # Lean 4 工具链（elan, Std-only）——陈述必须真实编译通过，否则部署失败。
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain=stable >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          node scripts/check-lean.mjs
      - name: Type-check & build
        run: npm run build
      - name: Deploy to Cloudflare Pages
        # 仓库尚未配置 CLOUDFLARE_API_TOKEN secret 时优雅跳过，
        # 避免每次 push 都出现失败红叉（手动 wrangler 部署仍是主路径）。
        if: ${{ env.CF_API_TOKEN != '' }}
        # wrangler 已是 devDependency（npm ci 本地安装），直接用本地 wrangler，
        # 避免 action 内 npx 拉取新版在 CI 无 TTY 时被取消。
        run: npx wrangler pages deploy dist/public --project-name=mathx-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Post-deploy ledger smoke (append-only audit against production)
        if: ${{ env.CF_API_TOKEN != '' }}
        run: node scripts/check-ledger.mjs https://mathx-bridge.pages.dev
