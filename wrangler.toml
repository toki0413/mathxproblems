# Cloudflare Pages 配置(Advanced Mode, 单入口 _worker.ts)。
# 前端静态构建进 dist/public; _worker.ts 由 Pages 自动打包为 worker 入口。
# 环境变量(APP_ID, APP_SECRET, ADMIN_TOKEN, TURNSTILE_SECRET 等)在 Pages 项目
# Settings -> Environment variables 里配置,生产/预览都要加(加密勾选)。
name = "mathx-bridge"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist/public"

# 站点存储：Cloudflare 原生 D1 (SQLite)。在 Pages 项目 Settings -> Bindings
# 里会自动带出；本地 `wrangler pages dev` 时按此配置直连该数据库。
[[d1_databases]]
binding = "DB"
database_name = "mathx-bridge-db"
database_id = "9ebfc6a9-4c93-42be-925e-63fabcbb01ba"

# 运行时非敏感开关（随仓库部署注入；wrangler pages deploy 会以本文件为准重置
# 项目 env_vars，因此非敏感配置放这里，敏感令牌走 `wrangler pages secret put`）。
[vars]
# 协议账本写路径门（契约 v0.1）：置 1 放开 POST /api/v1/claims/:id/narrow|formal，
# 经审稿账本闭环后进 feed.json / ledger.json。留空/缺省即闭门（501）。
CLAIMS_WRITE_ENABLED = "1"
